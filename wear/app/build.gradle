plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "io.github.missileminion.dashboard"
    compileSdk 36
    defaultConfig {
        applicationId "io.github.missileminion.dashboard"   // must match the phone app for the Data Layer link
        minSdk 30          // Wear OS 3+; the Galaxy Watch 8 runs Wear OS 6 (API 36)
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.wear.compose:compose-material3:1.5.0"
    implementation "androidx.wear.compose:compose-foundation:1.5.0"
    implementation "androidx.wear.compose:compose-navigation:1.5.0"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "androidx.health:health-services-client:1.1.0-alpha05"   // run tracking: heart rate, distance, pace, GPS
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"   // its hub and event ring, as complications
    implementation "androidx.wear.tiles:tiles:1.4.1"                 // the Today and Run tiles
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-expression:1.2.1"
}
