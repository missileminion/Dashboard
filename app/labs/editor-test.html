<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editor test: TipTap</title>
<link rel="stylesheet" href="https://esm.sh/katex@0.16.11/dist/katex.min.css">
<style>body{font:15px/1.5 system-ui;background:#10121a;color:#e8eaf2;margin:24px}#ed{border:1px solid #333;border-radius:10px;padding:14px;min-height:140px;max-width:760px}pre{white-space:pre-wrap;background:#0b0c12;padding:12px;border-radius:8px;max-width:760px}mark{background:#6b5b00;color:#fff}</style></head>
<body><h3>TipTap v3 round-trip test</h3><div id="ed"></div><h4>Result</h4><pre id="out">running…</pre>
<script type="module">
const V = "3.32.2", E = n => `https://esm.sh/${n}`;
const out = document.getElementById("out"), res = { loaded: {}, errors: [] };
window.__result = res;
const tryImport = async (k, url) => { try { const m = await import(url); res.loaded[k] = true; return m; } catch (e) { res.loaded[k] = false; res.errors.push(k + ": " + e.message); return null; } };
const core = await tryImport("core", E(`@tiptap/core@${V}`));
const sk = await tryImport("starterkit", E(`@tiptap/starter-kit@${V}`));
const img = await tryImport("image", E(`@tiptap/extension-image@${V}`));
const hl = await tryImport("highlight", E(`@tiptap/extension-highlight@${V}`));
const ts = await tryImport("textstyle", E(`@tiptap/extension-text-style@${V}`));
const md = await tryImport("markdown", E(`tiptap-markdown@0.9.0`));
const mth = await tryImport("math", E(`@aarkue/tiptap-math-extension@1.4.0`));
if (core && sk && md) {
  try {
    const exts = [sk.default || sk.StarterKit, (img.default || img.Image), (hl.default || hl.Highlight), md.Markdown.configure({ html: true, tightLists: true })];
    if (ts) { exts.push(ts.TextStyle, ts.Color); }
    if (mth) exts.push(mth.Mathematics || mth.default);
    const editor = new core.Editor({ element: document.getElementById("ed"), extensions: exts.filter(Boolean), content: "" });
    const src = `# Heading one\n\nSome *italic* and **bold** with <mark>highlight</mark> and <span style="color: #e5484d">red text</span>.\n\nInline math $E=mc^2$ here.\n\n$$\\int_0^1 x^2\\,dx = \\tfrac13$$\n\n![Figure 1: test|400](_files/x.png)\n\n[a link](https://example.com)\n`;
    editor.commands.setContent(src);
    const back = editor.storage.markdown.getMarkdown();
    res.back = back;
    res.checks = { heading: /^# Heading one/m.test(back), italic: /\*italic\*|_italic_/.test(back), bold: /\*\*bold\*\*/.test(back), highlight: /<mark>highlight<\/mark>/.test(back), color: /<span style="color: ?(#e5484d|rgb\(229, ?72, ?77\))">red text<\/span>/.test(back), inlineMath: /\$E=mc\^2\$/.test(back), blockMath: /\$\$[\s\S]*\\int_0\^1[\s\S]*\$\$/.test(back), image: /!\[Figure 1: test\|400\]\(_files\/x\.png\)/.test(back), link: /\[a link\]\(https:\/\/example\.com\)/.test(back) };
    res.html = editor.getHTML();
  } catch (e) { res.errors.push("run: " + e.message); }
}
out.textContent = JSON.stringify(res, null, 2);
</script></body></html>
