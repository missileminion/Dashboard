<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dots</title>
<link rel="stylesheet" href="labs.css">
<style>
 :root{--red:#e8222b;--dim:#2b2b2e;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
 body{background:#000;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:22px 22px}
 .back{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:11px;border-radius:999px}
 .wrap{max-width:1100px;margin:0 auto;padding:68px 18px 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:start} @media(max-width:860px){.wrap{grid-template-columns:1fr}}
 .dial{position:relative;aspect-ratio:1;max-width:560px;width:100%;margin:0 auto} .dial svg{width:100%;height:100%}
 .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none} .center .cap{color:#8a8a90;font-size:11px;text-align:center;max-width:46%;line-height:1.5} .center .cap b{color:#fff;font-weight:500}
 .panel{border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:18px 20px;background:rgba(255,255,255,.035);backdrop-filter:blur(14px)}
 .panel h2{margin:0 0 12px;font-size:11px;font-weight:500;color:#8a8a90;letter-spacing:.14em;display:flex;justify-content:space-between}
 .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px} .wd{text-align:center;color:#8a8a90;font-size:10px} .wd.t{color:#fff} .wd svg{width:100%;max-width:56px;display:block;margin:5px auto 0}
 .row{display:grid;grid-template-columns:16px 82px 1fr;gap:10px;align-items:center;padding:11px 0;border-top:1px dotted rgba(255,255,255,.22)} .row i{width:9px;height:9px;border-radius:50%;background:#555} .row.next i{background:var(--red);box-shadow:0 0 0 4px rgba(232,34,43,.2)} .row.now i{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.16)} .row.past{color:#6a6a70} .row.past i{background:#333}
 .row span:nth-child(2){color:#9a9aa0;font-variant-numeric:tabular-nums} .row.past span:nth-child(2){color:#5a5a60} .row small{display:block;color:#6a6a70;font-size:10px;margin-top:2px}
 .empty{color:#6a6a70;padding:12px 0;border-top:1px dotted rgba(255,255,255,.22)}
</style></head>
<body>
<a class="back" href="../index.html" onclick="try{localStorage.setItem('tab','cal')}catch(e){}">‹ Calendar</a>
<div class="wrap">
  <div class="dial"><svg id="dial" viewBox="0 0 560 560" aria-label="Your day as a ring of dots"></svg><div class="center"><svg id="clk" width="34%" viewBox="0 0 10 7" style="display:block"></svg><div class="cap" id="cap"></div></div></div>
  <div><div class="panel"><h2><span>This week</span><span id="plan"></span></h2><div class="week" id="week"></div>
    <h2><span>Today</span><span id="date"></span></h2><div id="list"></div></div>
    <p style="color:#5a5a60;font-size:10px;line-height:1.7;margin:14px 4px 0">Each dot on the ring is 15 minutes. White dots are scheduled, red is heavy (exams, deadlines), the thin outer arc is daylight, and the red pulse is now. In the week, each dot is an hour of the day.</p></div>
</div>
<script type="module">
import { sunPos } from "../js/sky.js";
import { events, today, hhmm, location_, connected } from "../js/calbridge.js";
import { addDays } from "../js/util.js";
import { plannedFor } from "../js/analytics.js";
const $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg", loc = location_(); let evs = [];
const G = { 0: ["01110", "10001", "10011", "10101", "11001", "10001", "01110"], 1: ["00100", "01100", "00100", "00100", "00100", "00100", "01110"], 2: ["01110", "10001", "00001", "00010", "00100", "01000", "11111"], 3: ["11110", "00001", "00001", "01110", "00001", "00001", "11110"], 4: ["00010", "00110", "01010", "10010", "11111", "00010", "00010"], 5: ["11111", "10000", "11110", "00001", "00001", "10001", "01110"], 6: ["00110", "01000", "10000", "11110", "10001", "10001", "01110"], 7: ["11111", "00001", "00010", "00100", "01000", "01000", "01000"], 8: ["01110", "10001", "10001", "01110", "10001", "10001", "01110"], 9: ["01110", "10001", "10001", "01111", "00001", "00010", "01100"], ":": ["0", "0", "1", "0", "1", "0", "0"] };
const heavy = t => /exam|midterm|final|quiz|due|deadline/i.test(t), esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mins = d => d.getHours() * 60 + d.getMinutes();
function clock(txt, blinkOn) {   // dot-matrix digits
  let x = 0, s = ""; for (const ch of txt) { const g = G[ch]; const w = g[0].length; g.forEach((row, r) => [...row].forEach((v, c) => { if (v === "1") s += `<circle cx="${x + c + .5}" cy="${r + .5}" r="0.36" fill="${ch === ":" ? "#e8222b" : "#fff"}"${ch === ":" && !blinkOn ? ' opacity=".25"' : ""}/>`; })); x += w + 1; }
  $("clk").setAttribute("viewBox", `-0.1 -0.1 ${x - 0.8} 7.2`); $("clk").innerHTML = s;
}
function dial() {
  const now = new Date(), nm = mins(now), cx = 280, cy = 280, R = 232, dayEv = evs.filter(e => !e.allDay && e.s < new Date(today() + "T23:59:59") && e.e > new Date(today() + "T00:00:00"));
  let s = "";
  for (let i = 0; i < 96; i++) {
    const t0 = i * 15, ang = t0 / 1440 * Math.PI * 2 - Math.PI / 2, x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
    const a = new Date(today() + "T00:00:00"); a.setMinutes(t0); const b = new Date(+a + 15 * 6e4);
    const hit = dayEv.filter(e => e.s < b && e.e > a), lit = hit.length, red = hit.some(e => heavy(e.title)), isNow = nm >= t0 && nm < t0 + 15;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isNow ? 8 : lit ? 6 : 3.2}" fill="${isNow ? "#e8222b" : lit ? (red ? "#e8222b" : "#fff") : "#2b2b2e"}">${isNow ? `<animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>` : ""}</circle>`;
    const alt = sunPos(+a, loc.lat, loc.lon).alt; if (alt > 0) { const r2 = R + 24, x2 = cx + Math.cos(ang) * r2, y2 = cy + Math.sin(ang) * r2; s += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.4" fill="#9a9aa0"/>`; }
  }
  [["00", 0], ["06", 6], ["12", 12], ["18", 18]].forEach(([l, h]) => { const ang = h / 24 * Math.PI * 2 - Math.PI / 2, x = cx + Math.cos(ang) * (R - 26), y = cy + Math.sin(ang) * (R - 26); s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" fill="#6a6a70" font-family="ui-monospace,Menlo,monospace">${l}</text>`; });
  $("dial").innerHTML = s;
  const fut = evs.filter(e => !e.allDay && e.e > now).sort((a, b) => a.s - b.s), cur = fut.find(e => e.s <= now), nxt = fut.find(e => e.s > now);
  $("cap").innerHTML = cur ? `NOW<br><b>${esc(cur.title)}</b><br>UNTIL ${hhmm(cur.e)}` : nxt ? `NEXT IN ${Math.floor((nxt.s - now) / 36e5) ? Math.floor((nxt.s - now) / 36e5) + "H " : ""}${Math.round(((nxt.s - now) / 6e4) % 60)}M<br><b>${esc(nxt.title)}</b>` : "NOTHING MORE TODAY";
  clock(hhmm(now), now.getSeconds() % 2 === 0);
}
function week() {
  const t = today(), days = [...Array(7)].map((_, i) => addDays(addDays(t, -1), i)); $("plan").textContent = plannedFor(t);
  $("week").innerHTML = days.map(d => {
    const a = new Date(d + "T00:00:00"), b = new Date(addDays(d, 1) + "T00:00:00"), h = evs.filter(e => !e.allDay && e.s < b && e.e > a).reduce((s, e) => s + (Math.min(+e.e, +b) - Math.max(+e.s, +a)) / 36e5, 0), hv = evs.some(e => heavy(e.title) && (e.allDay ? e.s <= new Date(d + "T12:00:00") && e.e > new Date(d + "T12:00:00") : e.s < b && e.e > a));
    const n = Math.min(12, Math.round(h)), dots = [...Array(12)].map((_, i) => `<circle cx="${8 + (i % 4) * 9.3}" cy="${9 + Math.floor(i / 4) * 9.3}" r="2.6" fill="${i < n ? (hv ? "#e8222b" : "#fff") : "#2b2b2e"}"/>`).join("");
    return `<div class="wd${d === t ? " t" : ""}">${new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" }).toUpperCase()}<svg viewBox="0 0 44 36"><rect x=".5" y=".5" width="43" height="35" rx="12" fill="none" stroke="${d === t ? "#e8222b" : "rgba(255,255,255,.14)"}"/>${dots}</svg></div>`;
  }).join("");
}
function list() {
  const now = new Date(), day = evs.filter(e => e.s < new Date(addDays(today(), 1) + "T00:00:00") && e.e > new Date(today() + "T00:00:00")).sort((a, b) => (a.allDay ? -1 : 0) - (b.allDay ? -1 : 0) || a.s - b.s);
  $("date").textContent = now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase(); let nextSet = false;
  $("list").innerHTML = day.length ? day.map(e => { const past = !e.allDay && e.e <= now, cur = !e.allDay && e.s <= now && e.e > now, nx = !past && !cur && !e.allDay && !nextSet; if (nx) nextSet = true;
    return `<div class="row ${past ? "past" : cur ? "now" : nx ? "next" : ""}"><i></i><span>${e.allDay ? "ALL DAY" : hhmm(e.s)}</span><span>${esc(e.title)}${e.location ? `<small>${esc(e.location)}</small>` : ""}</span></div>`; }).join("") : `<div class="empty">${connected() ? "NOTHING SCHEDULED" : "CONNECT YOUR CALENDAR IN THE CALENDAR TAB"}</div>`;
}
async function load() { if (connected()) { try { evs = await events(addDays(today(), -1), addDays(today(), 7)); } catch (e) { evs = []; $("cap").textContent = "COULD NOT LOAD: " + e.message; } } week(); list(); dial(); }
load(); setInterval(dial, 1000); setInterval(() => { list(); load(); }, 300000);
</script></body></html>
