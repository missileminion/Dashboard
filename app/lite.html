<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>Dashboard</title>
<!-- The phone layout. Same data, same rules, same storage as index.html. Five tabs; each number lives in exactly one place. -->
<link rel="modulepreload" href="js/lite.js"><link rel="modulepreload" href="js/analytics.js"><link rel="modulepreload" href="js/util.js"><link rel="modulepreload" href="js/standards.js"><link rel="modulepreload" href="js/dotfont.js"><link rel="modulepreload" href="js/db.js">
<link rel="icon" type="image/svg+xml" href="icons/app.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="lite.css">
</head><body>
<header class="top">
  <h1 id="title" aria-live="polite"></h1>
  <button class="sync" id="sync" type="button" aria-label="Sync status"><i></i><span id="syncTxt">…</span></button>
  <button class="gear" id="gear" type="button" aria-label="Connections and settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg></button>
</header>

<main id="view">
  <section class="pane" data-p="today"></section>
  <section class="pane" data-p="health" hidden></section>
  <section class="pane" data-p="plan" hidden></section>
  <section class="pane" data-p="gym" hidden></section>
  <section class="pane" data-p="notes" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button type="button" data-p="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span>Today</span></button>
  <button type="button" data-p="health"><svg viewBox="0 0 24 24"><path d="M2.5 12.5h4l2.2-5 3.6 10 2.6-6.5 1.6 1.5h5"/></svg><span>Health</span></button>
  <button type="button" data-p="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14.5h3"/></svg><span>Plan</span></button>
  <button type="button" data-p="gym"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Gym</span></button>
  <button type="button" data-p="notes"><svg viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8.5h5M9 12.5h7M9 16h5"/></svg><span>Notes</span></button>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" role="dialog" aria-modal="true"><div class="sheet-grip" data-close></div><div id="sheetBody"></div></div></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>window.CONFIG=window.CONFIG||{SCOPES:"https://www.googleapis.com/auth/googlehealth.sleep.readonly https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly",CLIENT_ID:(function(){try{return localStorage.getItem("clientId")||""}catch(e){return ""}})()};</script>
<script type="module" src="js/lite.js"></script>
<script>// offline copy for the website; inside the Android app the files are already on the phone, so no service worker there
if ("serviceWorker" in navigator && location.protocol === "https:" && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body></html>
